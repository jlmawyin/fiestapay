name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fiestapay
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fiestapay_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fiestapay -d fiestapay_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://fiestapay:ci-only-password@localhost:5432/fiestapay_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
