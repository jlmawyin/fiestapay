# Only this hostname is owned by FiestaPay. Other virtual hosts are untouched.
server {
    listen 80;
    server_name fiestapay.somospanas.com;
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs/fiestapay-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name fiestapay.somospanas.com;
    ssl_certificate /etc/nginx/certs/fiestapay-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fiestapay-privkey.pem;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    resolver 127.0.0.11 valid=10s;
    set $fiestapay_upstream fiestapay-api:3000;
    location / {
        proxy_pass http://$fiestapay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite client-supplied chains. This server is reached through Cloudflare.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
