# Only this hostname is owned by FiestaPay. Other virtual hosts are untouched.
server {
    listen 80;
    server_name fiestapay.somospanas.com;
    # Organizer links can carry a secret query parameter. Do not retain request URLs.
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs/fiestapay-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name fiestapay.somospanas.com;
    access_log off;
    error_log /dev/null crit;
    # Trust the visitor-IP header only from Cloudflare's published networks (2026-10-25).
    # Sources: https://www.cloudflare.com/ips-v4/ and https://www.cloudflare.com/ips-v6/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    ssl_certificate /etc/nginx/certs/fiestapay-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fiestapay-privkey.pem;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    resolver 127.0.0.11 valid=10s;
    set $fiestapay_upstream fiestapay-api:3000;
    location / {
        proxy_pass http://$fiestapay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite client-supplied chains. This server is reached through Cloudflare.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
